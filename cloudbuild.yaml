steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rz-scheduler-v2:$COMMIT_SHA'
      - 'tools/scheduling/backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rz-scheduler-v2:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'rz-scheduler-v2'
      - '--image=asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rz-scheduler-v2:$COMMIT_SHA'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--quiet'

images:
  - 'asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rz-scheduler-v2:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

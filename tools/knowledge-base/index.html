<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>知識資料庫 — 日翊客服小工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #f5f6f8;
      --bg2:       #ffffff;
      --bg3:       #f0f2f5;
      --line:      #e4e7ec;
      --line2:     #d0d5dd;
      --ink:       #101828;
      --ink2:      #475467;
      --ink3:      #98a2b3;
      --accent:    #3b82f6;
      --accent2:   #1d4ed8;
      --accent-bg: #eff6ff;
      --accent-text: #1d4ed8;
      --green:     #059669;
      --green-bg:  #ecfdf5;
      --amber:     #d97706;
      --amber-bg:  #fffbeb;
      --red:       #dc2626;
      --red-bg:    #fef2f2;
      --purple:    #7c3aed;
      --purple-bg: #f5f3ff;
      --radius:    8px;
      --radius-lg: 14px;
      --font:      'Noto Sans TC', sans-serif;
      --mono:      'JetBrains Mono', monospace;
      --shadow:    0 2px 12px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .hdr { display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 52px; border-bottom: 1px solid var(--line); background: var(--bg2); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .hdr-back { color: var(--ink2); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: color .15s; }
    .hdr-back:hover { color: var(--ink); }
    .hdr-title { font-size: 15px; font-weight: 700; color: var(--ink); flex: 1; }
    .hdr-badge { font-size: 11px; font-family: var(--mono); background: var(--accent-bg); color: var(--accent2); padding: 3px 8px; border-radius: 20px; border: 1px solid #bfdbfe; }
    .hdr-status { font-size: 11px; font-family: var(--mono); color: var(--ink3); display: flex; align-items: center; gap: 5px; }
    .hdr-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .hdr-dot.offline { background: var(--red); }
    .hdr-user { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); border-left: 1px solid var(--line); padding-left: 14px; margin-left: 4px; }
    .hdr-user-name { font-weight: 500; color: var(--ink); }
    .hdr-user-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-bg); color: var(--accent2); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 240px 1fr; flex: 1; height: calc(100vh - 56px); overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar { background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; width: 240px; }
    .sb-search { padding: 14px 14px 10px; }
    .sb-search-box { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 10px; transition: border-color .15s; }
    .sb-search-box:focus-within { border-color: var(--accent); }
    .sb-search-box svg { color: var(--ink3); flex-shrink: 0; }
    .sb-search-box input { background: none; border: none; outline: none; color: var(--ink); font-family: var(--font); font-size: 13px; width: 100%; padding: 8px 0; }
    .sb-search-box input::placeholder { color: var(--ink3); }

    .sb-new-btn { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--accent2); background: var(--accent-bg); border: none; border-radius: var(--radius); padding: 9px 14px; cursor: pointer; transition: background .15s; width: calc(100% - 28px); margin: 0 14px 4px; }
    .sb-new-btn:hover { background: #dbeafe; }

    .sb-section-label { font-size: 11px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 16px 6px; }

    .sb-nav { list-style: none; padding: 0 8px; }
    .sb-nav li { margin-bottom: 1px; }
    .sb-nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; transition: background .12s; font-size: 13px; color: var(--ink2); border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
    .sb-nav-item:hover { background: var(--bg3); color: var(--ink); }
    .sb-nav-item.active { background: var(--accent-bg); color: var(--accent2); font-weight: 500; }
    .sb-nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
    .sb-nav-count { margin-left: auto; font-size: 11px; font-family: var(--mono); color: var(--ink3); background: var(--bg3); padding: 1px 7px; border-radius: 10px; }
    .sb-nav-item.active .sb-nav-count { background: #dbeafe; color: var(--accent2); }

    .sb-divider { height: 1px; background: var(--line); margin: 10px 14px; }

    .sb-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
    .sb-list::-webkit-scrollbar { width: 4px; }
    .sb-list::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }

    .sb-empty { text-align: center; padding: 32px 16px; color: var(--ink3); font-size: 13px; }

    .sb-item { padding: 10px 10px; border-radius: var(--radius); cursor: pointer; transition: background .12s; margin-bottom: 2px; border-left: 3px solid transparent; }
    .sb-item:hover { background: var(--bg3); }
    .sb-item.active { background: var(--accent-bg); border-left-color: var(--accent); }
    .sb-item-title { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-item-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink3); }
    .sb-item-cat { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-family: var(--font); font-weight: 500; }
    .sb-item-snippet { font-size: 11px; color: var(--ink3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Main Content ── */
    .main { display: flex; flex-direction: column; overflow: hidden; background: #f9fafb; }

    /* Welcome state */
    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; }
    .welcome-icon { width: 64px; height: 64px; background: var(--accent-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .welcome h2 { font-size: 20px; font-weight: 700; }
    .welcome p { color: var(--ink2); text-align: center; font-size: 14px; line-height: 1.7; max-width: 300px; }
    .welcome-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 10px 24px; font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .welcome-btn:hover { opacity: .85; }

    /* Article view */
    .article-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .article-hdr { display: flex; align-items: flex-start; gap: 12px; padding: 20px 28px 16px; border-bottom: 1px solid var(--line); background: var(--bg2); }
    .article-hdr-main { flex: 1; min-width: 0; }
    .article-cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .article-title { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.4; }
    .article-meta { display: flex; align-items: center; gap: 14px; margin-top: 8px; font-size: 11px; font-family: var(--mono); color: var(--ink3); flex-wrap: wrap; }
    .article-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-icon { width: 32px; height: 32px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg2); color: var(--ink2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent2); background: var(--accent-bg); }
    .btn-icon.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }

    .article-body { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .article-body::-webkit-scrollbar { width: 4px; }
    .article-body::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
    .article-content { font-size: 14px; line-height: 1.9; color: var(--ink2); white-space: pre-wrap; word-break: break-word; }
    .article-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .tag-chip { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--line); color: var(--ink2); }

    /* Versions panel */
    .ver-panel { border-top: 1px solid var(--line); padding: 14px 28px; max-height: 180px; overflow-y: auto; background: #f9fafb; }
    .ver-panel::-webkit-scrollbar { width: 4px; }
    .ver-panel::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
    .ver-title { font-size: 11px; font-family: var(--mono); color: var(--ink3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .ver-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; font-family: var(--mono); color: var(--ink2); flex-wrap: wrap; }
    .ver-item:last-child { border: none; }
    .ver-num { color: var(--accent2); font-weight: 500; min-width: 30px; }
    .ver-operator { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-bg); color: var(--accent2); font-size: 10px; padding: 1px 7px; border-radius: 10px; font-family: var(--font); }
    .ver-action { font-size: 10px; padding: 1px 7px; border-radius: 10px; font-family: var(--font); }
    .ver-action-edit   { background: #fffbeb; color: #92400e; }
    .ver-action-create { background: #ecfdf5; color: #065f46; }
    .ver-action-delete { background: #fef2f2; color: #991b1b; }

    /* Editor */
    .editor-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .editor-hdr { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #fff; }
    .editor-title-text { font-size: 14px; font-weight: 600; flex: 1; }
    .btn-save { font-size: 12px; font-weight: 600; font-family: var(--font); background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 7px 18px; cursor: pointer; transition: opacity .15s; display: flex; align-items: center; gap: 6px; }
    .btn-save:hover { opacity: .85; }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel { font-size: 12px; font-family: var(--font); background: var(--bg3); color: var(--ink2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 14px; cursor: pointer; transition: all .15s; }
    .btn-cancel:hover { border-color: var(--line2); color: var(--ink); }

    .editor-form { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .editor-form::-webkit-scrollbar { width: 4px; }
    .editor-form::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
    .form-row { display: flex; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .form-label { font-size: 11px; font-family: var(--mono); color: var(--ink3); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-input, .form-select, .form-textarea { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); font-family: var(--font); font-size: 13px; padding: 9px 12px; transition: border-color .15s; outline: none; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-select { cursor: pointer; }
    .form-select option { background: var(--bg3); }
    .form-textarea { resize: vertical; min-height: 220px; line-height: 1.7; }

    /* Category badge colors */
    .cat-sop     { background: #eff6ff; color: #1d4ed8; }
    .cat-faq     { background: #ecfdf5; color: #065f46; }
    .cat-policy  { background: #fffbeb; color: #92400e; }
    .cat-notice  { background: #fef2f2; color: #991b1b; }
    .cat-other   { background: #f5f3ff; color: #5b21b6; }

    /* Loading overlay */
    .loading { position: fixed; inset: 0; background: rgba(249,250,251,0.92); display: flex; align-items: center; justify-content: center; z-index: 500; backdrop-filter: blur(4px); }
    .loading-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e4e7ec; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--ink2); font-family: var(--mono); margin-top: 4px; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: #fff; border: 1px solid var(--line); color: var(--ink); font-size: 13px; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); opacity: 0; transition: all .25s; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red); color: var(--red); }

    /* Count badge */
    .sb-count { font-size: 10px; font-family: var(--mono); background: var(--bg3); color: var(--ink3); padding: 1px 7px; border-radius: 20px; margin-left: auto; }

    /* ── Recent Activity Panel ── */
    .activity-panel { flex: 1; overflow-y: auto; padding: 28px 32px; background: #f9fafb; }
    .activity-panel::-webkit-scrollbar { width: 4px; }
    .activity-panel::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }

    .activity-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .activity-heading { font-size: 18px; font-weight: 700; color: var(--ink); }
    .activity-count-badge { font-size: 12px; font-family: var(--mono); color: var(--ink3); background: var(--bg3); border: 1px solid var(--line); padding: 3px 12px; border-radius: 20px; }

    .activity-section { margin-bottom: 24px; }
    .activity-section-title { font-size: 11px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .activity-section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .activity-item { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 8px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: box-shadow .15s, border-color .15s; }
    .activity-item:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(59,130,246,0.10); }
    .activity-item.deleted { cursor: default; opacity: .75; }
    .activity-item.deleted:hover { border-color: var(--line); box-shadow: none; }

    .activity-date { font-size: 12px; font-family: var(--mono); color: var(--ink3); min-width: 50px; text-align: center; line-height: 1.4; }
    .activity-date-day { font-size: 16px; font-weight: 700; color: var(--ink2); display: block; }

    .activity-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .badge-create { background: var(--green-bg); color: var(--green); }
    .badge-edit   { background: var(--amber-bg); color: var(--amber); }
    .badge-delete { background: var(--red-bg);   color: var(--red); }

    .activity-body { flex: 1; min-width: 0; }
    .activity-title { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-title.deleted { text-decoration: line-through; color: var(--ink3); }
    .activity-subtitle { font-size: 12px; color: var(--ink3); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .activity-arrow { color: var(--ink3); flex-shrink: 0; }

    .activity-empty { text-align: center; padding: 60px 20px; color: var(--ink3); }
    .activity-empty-icon { font-size: 40px; margin-bottom: 12px; }
    .activity-empty-text { font-size: 14px; margin-bottom: 20px; line-height: 1.7; }

    .activity-new-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 10px 24px; font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .activity-new-btn:hover { opacity: .85; }
  </style>
</head>
<body>

<!-- Auth guard -->
<script src="../../auth.js"></script>
<script>
  const _kbSession = AUTH.guard(null, '../../login.html');
  const _kbUser = _kbSession ? (_kbSession.displayName || _kbSession.username) : '未知帳號';
  const _kbUsername = _kbSession ? _kbSession.username : '';
</script>

<!-- Loading -->
<div class="loading" id="loadingOverlay">
  <div class="loading-inner">
    <div class="spinner"></div>
    <div class="loading-text">連線資料庫中…</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Header -->
<header class="hdr">
  <a href="../../home.html" class="hdr-back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    返回
  </a>
  <div class="hdr-title">📚 知識資料庫</div>
  <div class="hdr-badge">Firestore</div>
  <div class="hdr-status">
    <div class="hdr-dot" id="connDot"></div>
    <span id="connLabel">連線中…</span>
  </div>
  <div class="hdr-user" id="hdrUser"></div>
</header>

<!-- Layout -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-search">
      <div class="sb-search-box">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="搜尋標題、內容、標籤…" oninput="handleSearch()"/>
      </div>
    </div>

    <button class="sb-new-btn" onclick="openEditor(null)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      新增文章
    </button>

    <div class="sb-section-label">快速導覽</div>
    <ul class="sb-nav">
      <li><button class="sb-nav-item" id="nav-home" onclick="showHome()">
        <span class="sb-nav-icon">🏠</span> 首頁
      </button></li>
    </ul>

    <div class="sb-section-label">分類</div>
    <ul class="sb-nav">
      <li><button class="sb-nav-item active" id="filter-all" onclick="setFilter('all')">
        <span class="sb-nav-icon">📋</span> 全部
        <span class="sb-nav-count" id="cnt-all">0</span>
      </button></li>
      <li><button class="sb-nav-item" id="filter-sop" onclick="setFilter('sop')">
        <span class="sb-nav-icon">📌</span> SOP 作業程序
        <span class="sb-nav-count" id="cnt-sop">0</span>
      </button></li>
      <li><button class="sb-nav-item" id="filter-faq" onclick="setFilter('faq')">
        <span class="sb-nav-icon">💬</span> FAQ 常見問答
        <span class="sb-nav-count" id="cnt-faq">0</span>
      </button></li>
      <li><button class="sb-nav-item" id="filter-policy" onclick="setFilter('policy')">
        <span class="sb-nav-icon">📜</span> 規範 / 規則
        <span class="sb-nav-count" id="cnt-policy">0</span>
      </button></li>
      <li><button class="sb-nav-item" id="filter-notice" onclick="setFilter('notice')">
        <span class="sb-nav-icon">⚠️</span> 注意事項
        <span class="sb-nav-count" id="cnt-notice">0</span>
      </button></li>
      <li><button class="sb-nav-item" id="filter-other" onclick="setFilter('other')">
        <span class="sb-nav-icon">📁</span> 其他
        <span class="sb-nav-count" id="cnt-other">0</span>
      </button></li>
    </ul>

    <div class="sb-divider"></div>
    <div class="sb-list" id="sbList">
      <div class="sb-empty" id="sbEmpty" style="display:none">找不到相關文章</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="mainPanel">

    <!-- Activity Panel (近期動態, replaces old welcome) -->
    <div class="activity-panel" id="welcomePanel">
      <div class="activity-top">
        <div class="activity-heading">近期動態</div>
        <div class="activity-count-badge" id="activityCountBadge">載入中…</div>
      </div>
      <div id="activityContent">
        <div class="activity-empty">
          <div class="activity-empty-icon">📚</div>
          <div class="activity-empty-text">知識資料庫<br>集中管理客服 SOP、FAQ 與規範，全部即時儲存至 Firestore。</div>
          <button class="activity-new-btn" onclick="openEditor(null)">＋ 新增第一篇文章</button>
        </div>
      </div>
    </div>

    <!-- Article view -->
    <div class="article-view" id="articlePanel" style="display:none">
      <div class="article-hdr">
        <div class="article-hdr-main">
          <div class="article-cat-row">
            <span class="sb-item-cat" id="viewCat"></span>
            <span style="font-size:11px;font-family:var(--mono);color:var(--ink3)" id="viewVer"></span>
          </div>
          <div class="article-title" id="viewTitle"></div>
          <div class="article-meta">
            <span id="viewCreated"></span>
            <span id="viewUpdated"></span>
            <span id="viewAuthor"></span>
            <span id="viewLastEditor"></span>
          </div>
        </div>
        <div class="article-actions">
          <button class="btn-icon" title="編輯" onclick="openEditor(currentDoc)">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon danger" title="刪除" onclick="deleteDoc(currentDoc)">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
      <div class="article-body">
        <div class="article-content" id="viewContent"></div>
        <div class="article-tags" id="viewTags"></div>
      </div>
      <div class="ver-panel" id="verPanel">
        <div class="ver-title">版本歷史</div>
        <div id="verList"></div>
      </div>
    </div>

    <!-- Editor -->
    <div class="editor-view" id="editorPanel" style="display:none">
      <div class="editor-hdr">
        <div class="editor-title-text" id="editorTitle">新增文章</div>
        <button class="btn-cancel" onclick="closeEditor()">取消</button>
        <button class="btn-save" id="saveBtn" onclick="saveDoc()">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          儲存
        </button>
      </div>
      <div class="editor-form">
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label class="form-label">標題 *</label>
            <input type="text" class="form-input" id="fTitle" placeholder="文章標題"/>
          </div>
          <div class="form-group">
            <label class="form-label">分類 *</label>
            <select class="form-select" id="fCat">
              <option value="sop">SOP 作業程序</option>
              <option value="faq">FAQ 常見問答</option>
              <option value="policy">規範 / 規則</option>
              <option value="notice">注意事項</option>
              <option value="other">其他</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">關鍵字 / 標籤（逗號分隔）</label>
          <input type="text" class="form-input" id="fTags" placeholder="例：退換貨, 物流異常, ETA"/>
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label">內容 *</label>
          <textarea class="form-textarea" id="fContent" placeholder="輸入文章內容…" style="flex:1;min-height:300px"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">編輯摘要（此版本修改說明）</label>
          <input type="text" class="form-input" id="fSummary" placeholder="例：更新退換貨期限條件"/>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyBr1bq3WUhjjXH9rvKLgVa-DFK1vrg5QeM",
    authDomain:        "opshub-knowledge.firebaseapp.com",
    projectId:         "opshub-knowledge",
    storageBucket:     "opshub-knowledge.firebasestorage.app",
    messagingSenderId: "257794213641",
    appId:             "1:257794213641:web:df105659dee73c393d75d8"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let allDocs = [];
  let currentDoc = null;
  let editingDoc = null;
  let activeFilter = 'all';

  const CAT = {
    sop:    { label: 'SOP',  cls: 'cat-sop'    },
    faq:    { label: 'FAQ',  cls: 'cat-faq'    },
    policy: { label: '規範', cls: 'cat-policy' },
    notice: { label: '注意', cls: 'cat-notice' },
    other:  { label: '其他', cls: 'cat-other'  },
  };

  function catBadge(key) {
    const c = CAT[key] || CAT.other;
    return `<span class="sb-item-cat ${c.cls}">${c.label}</span>`;
  }

  function toast(msg, type='') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast show ${type}`;
    setTimeout(() => el.className = 'toast', 2800);
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = (ts && ts.toDate) ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('zh-TW') + ' ' + d.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
  }

  // ── 近期動態 ──────────────────────────────────────────────
  async function loadRecentActivity() {
    const container = document.getElementById('activityContent');
    const badge     = document.getElementById('activityCountBadge');

    // 只在 welcomePanel 顯示時才需要更新（節省讀取次數）
    // 但每次 allDocs 更新都重算，因為資料已在記憶體中

    // 取最近 20 筆 knowledge（已按 updatedAt desc）
    const recentDocs = allDocs.slice(0, 20);

    // 讀取 audit_log（刪除記錄）最近 10 筆
    let deletedItems = [];
    try {
      const auditSnap = await db.collection('audit_log')
        .orderBy('timestamp', 'desc').limit(10).get();
      deletedItems = auditSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) { /* audit_log 可能為空，忽略錯誤 */ }

    // 合併並統一格式
    const combined = [];

    recentDocs.forEach(d => {
      const isNew = (d.version || 1) === 1;
      combined.push({
        type:      isNew ? 'create' : 'edit',
        title:     d.title || '（無標題）',
        category:  d.category,
        operator:  d.lastEditedBy || d.author || '',
        ts:        d.updatedAt,
        docRef:    d
      });
    });

    deletedItems.forEach(a => {
      combined.push({
        type:     'delete',
        title:    a.title || '（已刪除）',
        category: null,
        operator: a.operator || '',
        ts:       a.timestamp,
        docRef:   null
      });
    });

    // 按時間排序（最新在前）
    combined.sort((a, b) => {
      const ta = a.ts && a.ts.toDate ? a.ts.toDate() : new Date(0);
      const tb = b.ts && b.ts.toDate ? b.ts.toDate() : new Date(0);
      return tb - ta;
    });

    const total = combined.length;
    badge.textContent = total + ' 則動態';

    if (total === 0) {
      container.innerHTML = `
        <div class="activity-empty">
          <div class="activity-empty-icon">📚</div>
          <div class="activity-empty-text">知識資料庫<br>集中管理客服 SOP、FAQ 與規範，全部即時儲存至 Firestore。</div>
          <button class="activity-new-btn" onclick="openEditor(null)">＋ 新增第一篇文章</button>
        </div>`;
      return;
    }

    // 按「今天 / 近7天 / 更早」分組
    const now   = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const week  = new Date(today); week.setDate(week.getDate() - 7);

    const groups = [
      { key: 'today',  label: '今天',   items: [] },
      { key: 'week',   label: '近 7 天', items: [] },
      { key: 'older',  label: '更早',   items: [] },
    ];

    combined.forEach(item => {
      const d = item.ts && item.ts.toDate ? item.ts.toDate() : null;
      if (!d) { groups[2].items.push(item); return; }
      if (d >= today)       groups[0].items.push(item);
      else if (d >= week)   groups[1].items.push(item);
      else                  groups[2].items.push(item);
    });

    const BADGE = {
      create: { cls: 'badge-create', label: '新增' },
      edit:   { cls: 'badge-edit',   label: '修改' },
      delete: { cls: 'badge-delete', label: '刪除' },
    };

    let html = '';
    groups.forEach(g => {
      if (g.items.length === 0) return;
      html += `<div class="activity-section">
        <div class="activity-section-title">${g.label}</div>`;

      g.items.forEach(item => {
        const b   = BADGE[item.type] || BADGE.edit;
        const d   = item.ts && item.ts.toDate ? item.ts.toDate() : null;
        const day = d ? d.getDate() : '—';
        const mon = d ? (d.getMonth()+1) + '月' : '';
        const time = d ? d.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'}) : '';
        const catBadgeHtml = item.category ? catBadge(item.category) : '';
        const isDeleted = item.type === 'delete';
        const clickable = !isDeleted ? `onclick="viewDoc(${JSON.stringify({...item.docRef}).replace(/"/g,'&quot;')})"` : '';
        const arrowHtml = !isDeleted ? `<div class="activity-arrow"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>` : '';

        html += `<div class="activity-item${isDeleted ? ' deleted' : ''}" ${!isDeleted ? `onclick="viewDoc(allDocs.find(x=>x.id==='${item.docRef ? item.docRef.id : ''}')||null)"` : ''}>
          <div class="activity-date">
            <span class="activity-date-day">${day}</span>
            ${mon}<br><span style="font-size:10px">${time}</span>
          </div>
          <span class="activity-badge ${b.cls}">${b.label}</span>
          <div class="activity-body">
            <div class="activity-title${isDeleted ? ' deleted' : ''}">${esc(item.title)}</div>
            <div class="activity-subtitle">
              ${catBadgeHtml}
              ${item.operator ? `<span>👤 ${esc(item.operator)}</span>` : ''}
            </div>
          </div>
          ${arrowHtml}
        </div>`;
      });

      html += `</div>`;
    });

    container.innerHTML = html;
  }

  function init() {
    // Timeout fallback — if Firestore doesn't respond in 8s, show error
    const timeout = setTimeout(() => {
      hideLoading();
      document.getElementById('connDot').classList.add('offline');
      document.getElementById('connLabel').textContent = '連線逾時';
      toast('Firestore 連線逾時，請確認安全規則已設為允許讀取', 'error');
    }, 8000);

    db.collection('knowledge').orderBy('updatedAt', 'desc').onSnapshot(snap => {
      clearTimeout(timeout);
      allDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
      loadRecentActivity();
      hideLoading();
      document.getElementById('connDot').classList.remove('offline');
      document.getElementById('connLabel').textContent = allDocs.length + ' 篇';
    }, err => {
      clearTimeout(timeout);
      console.error(err);
      hideLoading();
      document.getElementById('connDot').classList.add('offline');
      document.getElementById('connLabel').textContent = '連線失敗';
      toast('連線失敗：' + err.message, 'error');
    });
  }

  function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const items = allDocs.filter(d => {
      const matchFilter = activeFilter === 'all' || d.category === activeFilter;
      if (!matchFilter) return false;
      if (!q) return true;
      return (d.title||'').toLowerCase().includes(q)
          || (d.content||'').toLowerCase().includes(q)
          || (d.tags||[]).some(t => t.toLowerCase().includes(q));
    });

    const list  = document.getElementById('sbList');
    const empty = document.getElementById('sbEmpty');
    list.querySelectorAll('.sb-item').forEach(e => e.remove());
    empty.style.display = items.length === 0 ? '' : 'none';

    items.forEach(d => {
      const el = document.createElement('div');
      el.className = 'sb-item' + (currentDoc && currentDoc.id === d.id ? ' active' : '');
      el.dataset.id = d.id;
      el.onclick = () => viewDoc(d);
      el.innerHTML = `
        <div class="sb-item-title">${esc(d.title || '（無標題）')}</div>
        <div class="sb-item-meta">
          ${catBadge(d.category)}
          <span>${fmtDate(d.updatedAt)}</span>
          <span class="sb-count">v${d.version||1}</span>
        </div>
        <div class="sb-item-snippet">${esc((d.content||'').slice(0,60))}…</div>
      `;
      list.appendChild(el);
    });

    // Update nav item active states
    document.querySelectorAll('.sb-nav-item').forEach(btn => {
      const f = btn.id.replace('filter-','');
      btn.classList.toggle('active', f === activeFilter);
    });

    // Update counts
    const counts = { all: allDocs.length, sop:0, faq:0, policy:0, notice:0, other:0 };
    allDocs.forEach(d => { if (counts[d.category] !== undefined) counts[d.category]++; else counts.other++; });
    Object.keys(counts).forEach(k => {
      const el = document.getElementById('cnt-' + k);
      if (el) el.textContent = counts[k];
    });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function viewDoc(d) {
    currentDoc = d;
    document.querySelectorAll('.sb-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === d.id);
    });

    document.getElementById('viewCat').className = `sb-item-cat ${CAT[d.category] ? CAT[d.category].cls : 'cat-other'}`;
    document.getElementById('viewCat').textContent = CAT[d.category] ? CAT[d.category].label : '其他';
    document.getElementById('viewVer').textContent = 'v' + (d.version||1);
    document.getElementById('viewTitle').textContent = d.title || '';
    document.getElementById('viewContent').textContent = d.content || '';
    document.getElementById('viewCreated').textContent = '建立：' + fmtDate(d.createdAt);
    document.getElementById('viewUpdated').textContent = '更新：' + fmtDate(d.updatedAt);
    document.getElementById('viewAuthor').textContent  = d.author ? '建立：' + d.author : '';
    document.getElementById('viewLastEditor').innerHTML = d.lastEditedBy
      ? `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--accent-bg);color:var(--accent2);padding:1px 8px;border-radius:10px;font-size:10px;">✏️ 最後編輯：${d.lastEditedBy}</span>`
      : '';

    const tagsEl = document.getElementById('viewTags');
    tagsEl.innerHTML = (d.tags||[]).map(t => `<span class="tag-chip">${esc(t)}</span>`).join('');

    try {
      const verSnap = await db.collection('knowledge').doc(d.id).collection('versions').orderBy('savedAt', 'desc').get();
      const verList = document.getElementById('verList');
      verList.innerHTML = '';
      if (verSnap.empty) {
        verList.innerHTML = '<div style="font-size:12px;color:var(--ink3);font-family:var(--mono)">尚無歷史版本</div>';
      } else {
        verSnap.docs.forEach(v => {
          const vd = v.data();
          const el = document.createElement('div');
          el.className = 'ver-item';
          const actionCls = vd.action === 'create' ? 'ver-action-create' : 'ver-action-edit';
          const actionLabel = vd.action === 'create' ? '新增' : '編輯';
          el.innerHTML = `
            <span class="ver-num">v${vd.version}</span>
            <span>${esc(vd.title||'')}</span>
            ${vd.operator ? `<span class="ver-operator">👤 ${esc(vd.operator)}</span>` : ''}
            <span class="ver-action ${actionCls}">${actionLabel}</span>
            <span style="margin-left:auto;color:var(--ink3)">${fmtDate(vd.savedAt)}</span>
            ${vd.summary ? `<span style="color:var(--ink3);font-size:11px">— ${esc(vd.summary)}</span>` : ''}
          `;
          verList.appendChild(el);
        });
      }
    } catch(e) {}

    show('article');
  }

  function openEditor(d) {
    editingDoc = d;
    document.getElementById('editorTitle').textContent = d ? '編輯文章' : '新增文章';
    document.getElementById('fTitle').value   = d ? (d.title   || '') : '';
    document.getElementById('fCat').value     = d ? (d.category|| 'sop') : 'sop';
    document.getElementById('fTags').value    = d ? ((d.tags||[]).join(', ')) : '';
    document.getElementById('fContent').value = d ? (d.content || '') : '';
    document.getElementById('fSummary').value = '';
    show('editor');
  }

  function closeEditor() {
    if (currentDoc) show('article');
    else            show('welcome');
  }

  async function saveDoc() {
    const title   = document.getElementById('fTitle').value.trim();
    const content = document.getElementById('fContent').value.trim();
    const cat     = document.getElementById('fCat').value;
    const tags    = document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const summary = document.getElementById('fSummary').value.trim();

    if (!title || !content) { toast('請填寫標題與內容', 'error'); return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '儲存中…';

    try {
      if (editingDoc) {
        const newVer = (editingDoc.version||1) + 1;
        await db.collection('knowledge').doc(editingDoc.id).collection('versions').add({
          version:   editingDoc.version||1,
          title:     editingDoc.title,
          content:   editingDoc.content,
          category:  editingDoc.category,
          tags:      editingDoc.tags||[],
          savedAt:   firebase.firestore.FieldValue.serverTimestamp(),
          summary:   summary||'（無描述）',
          operator:  _kbUser,
          username:  _kbUsername,
          action:    'edit'
        });
        await db.collection('knowledge').doc(editingDoc.id).set({
          title, content, category: cat, tags,
          version:        newVer,
          updatedAt:      firebase.firestore.FieldValue.serverTimestamp(),
          createdAt:      editingDoc.createdAt,
          author:         editingDoc.author || _kbUser,
          lastEditedBy:   _kbUser,
          lastEditedUser: _kbUsername
        });
        toast('✓ 文章已更新', 'success');
        show('article');
      } else {
        const ref = await db.collection('knowledge').add({
          title, content, category: cat, tags,
          version:        1,
          createdAt:      firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt:      firebase.firestore.FieldValue.serverTimestamp(),
          author:         _kbUser,
          authorUsername: _kbUsername,
          lastEditedBy:   _kbUser,
          lastEditedUser: _kbUsername
        });
        toast('✓ 文章已新增', 'success');
        // wait for realtime update to populate allDocs, then view
        setTimeout(() => {
          const found = allDocs.find(d => d.id === ref.id);
          if (found) viewDoc(found);
          else show('welcome');
        }, 1200);
      }
    } catch(e) {
      toast('儲存失敗：' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '儲存';
    }
  }

  async function deleteDoc(d) {
    if (!d) return;
    if (!confirm(`確定刪除「${d.title}」？此操作無法還原。`)) return;
    try {
      // 刪除前寫入 audit log
      await db.collection('audit_log').add({
        action:    'delete',
        docId:     d.id,
        title:     d.title,
        operator:  _kbUser,
        username:  _kbUsername,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('knowledge').doc(d.id).delete();
      currentDoc = null;
      show('welcome');
      toast('文章已刪除');
    } catch(e) {
      toast('刪除失敗：' + e.message, 'error');
    }
  }

  function showHome() {
    currentDoc = null;
    document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.sb-nav-item').forEach(btn => btn.classList.remove('active'));
    document.getElementById('nav-home').classList.add('active');
    show('welcome');
  }

  function setFilter(f) {
    document.getElementById('nav-home').classList.remove('active');
    activeFilter = f;
    renderList();
  }

  function handleSearch() { renderList(); }

  function show(panel) {
    document.getElementById('welcomePanel').style.display = panel === 'welcome' ? '' : 'none';
    document.getElementById('articlePanel').style.display = panel === 'article' ? '' : 'none';
    document.getElementById('editorPanel').style.display  = panel === 'editor'  ? '' : 'none';
    if (panel === 'welcome') loadRecentActivity();
  }

  // 顯示 header 帳號資訊
  (function renderUser() {
    const el = document.getElementById('hdrUser');
    if (!el) return;
    const initials = _kbUser ? _kbUser.slice(0,1).toUpperCase() : '?';
    el.innerHTML = `
      <div class="hdr-user-avatar">${initials}</div>
      <span class="hdr-user-name">${_kbUser}</span>
    `;
  })();

  init();
</script>
</body>
</html>
